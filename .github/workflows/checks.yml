name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Настроить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить типы
        run: pnpm run typecheck

      - name: Линт
        run: pnpm run lint

      - name: Тесты
        run: pnpm run test:node

      - name: Собрать unpacked-приложение
        run: pnpm run build:dir

      - name: Smoke packaged application
        run: pnpm run smoke

      - name: Сохранить unpacked-сборку
        uses: actions/upload-artifact@v4
        with:
          name: codex-account-manager-win-unpacked
          path: release/win-unpacked
          if-no-files-found: error
